meta:
  game_name: "Terraria"
  config_file: "serverconfig.txt"
  parser: "properties"

sections:
  - name: "基础设置"
    fields:
      - key: "world"
        label: "世界文件路径"
        type: "string"
        default: ""
      - key: "autocreate"
        label: "自动创建世界大小"
        type: "select"
        default: "2"
        options:
          - value: "1"
            label: "小"
          - value: "2"
            label: "中"
          - value: "3"
            label: "大"
      - key: "worldname"
        label: "世界名称"
        type: "string"
        default: "TerrariaWorld"
      - key: "maxplayers"
        label: "最大玩家数"
        type: "number"
        default: 8
        min: 1
        max: 255
      - key: "port"
        label: "端口"
        type: "number"
        default: 7777
      - key: "password"
        label: "密码"
        type: "string"
        default: ""
      - key: "motd"
        label: "服务器描述"
        type: "string"
        default: "Welcome to Terraria!"
      - key: "difficulty"
        label: "难度"
        type: "select"
        default: "0"
        options:
          - value: "0"
            label: "普通"
          - value: "1"
            label: "专家"
          - value: "2"
            label: "大师"
          - value: "3"
            label: "旅途"
      - key: "secure"
        label: "反作弊"
        type: "boolean"
        default: true
      - key: "language"
        label: "语言"
        type: "select"
        default: "zh-Hans"
        options:
          - value: "en-US"
            label: "英语"
          - value: "zh-Hans"
            label: "简体中文"
