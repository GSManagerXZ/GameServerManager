meta:
  game_name: "泰拉瑞亚"
  config_file: "serverconfig.txt"
  parser: "properties"

sections:
  - key: "serverconfig.txt"
    fields:
      - name: "world"
        display: "世界文件路径"
        default: "Worlds/world1.wld"
        type: "string"
        description: "要加载的世界文件。使用相对路径时会相对于服务端工作目录解析，建议与服务端文件放在同一持久化目录中"
      - name: "autocreate"
        display: "自动创建世界大小"
        default: "1"
        type: "select"
        description: "当 world 指定的世界不存在时自动创建世界"
        options:
          - value: "0"
            label: "不自动创建"
          - value: "1"
            label: "小世界"
          - value: "2"
            label: "中世界"
          - value: "3"
            label: "大世界"
      - name: "seed"
        display: "世界种子"
        default: ""
        type: "string"
        description: "自动创建世界时使用的种子，留空则随机生成"
      - name: "worldname"
        display: "世界名称"
        default: "Terraria"
        type: "string"
        description: "自动创建世界时使用的世界名称"
      - name: "difficulty"
        display: "世界难度"
        default: "0"
        type: "select"
        description: "自动创建世界时使用的难度"
        options:
          - value: "0"
            label: "经典"
          - value: "1"
            label: "专家"
          - value: "2"
            label: "大师"
          - value: "3"
            label: "旅途"
      - name: "maxplayers"
        display: "最大玩家数"
        default: 8
        type: "number"
        description: "允许加入服务器的最大玩家数量，官方配置示例范围为 1 到 255"
      - name: "port"
        display: "服务器端口"
        default: 7777
        type: "number"
        description: "Terraria 默认使用 7777 TCP"
      - name: "password"
        display: "服务器密码"
        default: ""
        type: "string"
        description: "加入服务器需要输入的密码，留空表示无密码"
      - name: "motd"
        display: "每日消息"
        default: ""
        type: "string"
        description: "玩家进入服务器时显示的消息"
      - name: "worldpath"
        display: "世界目录"
        default: "Worlds"
        type: "string"
        description: "世界文件保存目录。Terraria 配置文件中不支持 $HOME 或 ~ 展开，建议使用相对路径或绝对路径"
      - name: "worldrollbackstokeep"
        display: "世界回滚备份数量"
        default: 2
        type: "number"
        description: "保留的滚动世界备份数量"
      - name: "banlist"
        display: "封禁列表路径"
        default: "banlist.txt"
        type: "string"
        description: "封禁列表文件位置，默认在服务端工作目录下"
      - name: "secure"
        display: "作弊防护"
        default: "1"
        type: "select"
        description: "启用 Terraria 服务端的额外作弊防护"
        options:
          - value: "1"
            label: "启用"
          - value: "0"
            label: "关闭"
      - name: "language"
        display: "服务器语言"
        default: "zh-Hans"
        type: "select"
        description: "服务端输出语言"
        options:
          - value: "zh-Hans"
            label: "简体中文"
          - value: "en-US"
            label: "English"
          - value: "de-DE"
            label: "Deutsch"
          - value: "it-IT"
            label: "Italiano"
          - value: "fr-FR"
            label: "Francais"
          - value: "es-ES"
            label: "Espanol"
          - value: "ru-RU"
            label: "Русский"
          - value: "pt-BR"
            label: "Portugues"
          - value: "pl-PL"
            label: "Polski"
      - name: "upnp"
        display: "UPnP 自动端口转发"
        default: "0"
        type: "select"
        description: "是否尝试通过 UPnP 自动转发端口。没有公网 IP 或处于 CGNAT 时仍需使用内网穿透等方案"
        options:
          - value: "0"
            label: "关闭"
          - value: "1"
            label: "启用"
      - name: "npcstream"
        display: "NPC 同步频率"
        default: 60
        type: "number"
        description: "降低敌怪跳跃感但会增加带宽占用，0 表示关闭"
      - name: "priority"
        display: "进程优先级"
        default: "1"
        type: "select"
        description: "服务端进程优先级"
        options:
          - value: "0"
            label: "实时"
          - value: "1"
            label: "高"
          - value: "2"
            label: "高于正常"
          - value: "3"
            label: "正常"
          - value: "4"
            label: "低于正常"
          - value: "5"
            label: "空闲"
      - name: "slowliquids"
        display: "降低液体更新量"
        default: "0"
        type: "select"
        description: "可降低同一时间移动的液体上限，可能减少卡顿但液体结算更慢"
        options:
          - value: "0"
            label: "关闭"
          - value: "1"
            label: "启用"

  - key: "journey"
    fields:
      - name: "journeypermission_time_setfrozen"
        display: "旅途权限：冻结时间"
        default: "2"
        type: "select"
        description: "0 为所有人锁定，1 为仅主机可改，2 为所有人可改"
        options:
          - value: "0"
            label: "锁定"
          - value: "1"
            label: "仅主机"
          - value: "2"
            label: "所有人"
      - name: "journeypermission_time_setdawn"
